<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerätekunde Leistungsprüfung</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">

        <!-- START SCREEN -->
        <div id="start-screen" class="card">
            <h1>Gerätekunde Leistungsprüfung</h1>
            <p style="margin-bottom: 25px; color: #ccc;">Wähle einen Modus, um zu starten:</p>
            <div style="display: flex; justify-content: center; gap: 15px; flex-wrap: wrap;">
                <button onclick="startTest()">Test</button>
                <button onclick="startOverview()">Übersicht</button>
            </div>
        </div>

        <!-- MAIN SCREEN -->
        <div id="main-screen" class="hidden">
            <header>
                <div id="quiz-info" class="hidden">
                    <div>Gefunden: <span id="found-count">0</span></div>
                    <div>Fehler: <span id="error-count">0</span></div>
                    <div>Gesucht: <span id="target-device-name">-</span></div>
                </div>
                <button class="small-btn" onclick="showStartScreen()">Hauptmenü</button>
            </header>

            <div class="content-container">
                <!-- Vogelperspektive Navigation -->
                <div id="birdseye-container" class="birdseye-wrapper">
                    <button class="nav-btn btn-kabine" onclick="switchView('mannschaftskabine')" title="Mannschaftskabine"></button>
                    <button class="nav-btn btn-fahrerseite" onclick="switchView('fahrerseite')" title="Fahrerseite"></button>
                    <button class="nav-btn btn-beifahrerseite" onclick="switchView('beifahrerseite')" title="Beifahrerseite"></button>
                    <button class="nav-btn btn-heck" onclick="switchView('heck')" title="Heck"></button>
                    <img id="birdseye-img" src="./img/vogelperspektive.png" alt="Vogelperspektive">
                </div>

                <!-- Hauptbereich Bild -->
                <div class="view-wrapper">
                    <h2 id="view-title">FAHRERSEITE</h2>
                    <div class="image-container" id="image-container">
                        <img id="vehicle-img" src="./img/fahrerseite.jpeg" usemap="#vehicle-map" alt="Fahrzeugansicht">
                        <map name="vehicle-map" id="vehicle-map"></map>
                        <div id="highlight-overlay"></div>
                    </div>
                    
                    <!-- Feedback-Leisten (Richtig / Falsch) -->
                    <div id="correct-feedback" class="feedback-correct hidden">Richtig!</div>
                    <div id="wrong-feedback" class="feedback-wrong hidden"></div>
                    
                    <div id="info-box" class="info-box hidden"></div>
                </div>

                <!-- Raster mit 30 Buttons im Übersichts-Modus -->
                <div id="overview-grid" class="overview-grid hidden" lang="de"></div>
            </div>
        </div>

        <!-- RESULT SCREEN -->
        <div id="result-screen" class="card hidden">
            <h2>Testergebnis</h2>
            <p style="margin: 15px 0;">Gefunden: <strong id="res-found">0</strong></p>
            <p style="margin: 15px 0;">Fehler: <strong id="res-errors">0</strong></p>
            <p style="margin: 15px 0;">Benötigte Zeit: <strong id="res-time">0m 0s</strong></p>
            <button onclick="showStartScreen()">Zurück zum Hauptmenü</button>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
