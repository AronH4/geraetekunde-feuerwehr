<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerätekunde Feuerwehr</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Firebase SDKs (Modulare Einbindung v9+) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        window.firebaseApp = { initializeApp, getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy, limit };
    </script>
</head>
<body>
    <div class="container">
        <!-- HAUPTMENÜ -->
        <div id="main-menu" class="screen">
            <h1>Gerätekunde Feuerwehr</h1>
            <p>Wähle einen Modus:</p>
            <button id="btn-practice" class="menu-btn">Übungsmodus</button>
            <button id="btn-test" class="menu-btn">Test-Modus (Highscore)</button>
            <button id="btn-highscore" class="menu-btn secondary">Highscore-Liste</button>
        </div>

        <!-- ÜBUNGSMODUS -->
        <div id="practice-screen" class="screen hidden">
            <h2>Übungsmodus</h2>
            <div id="practice-question-container"></div>
            <button id="practice-back-btn" class="secondary-btn">Zurück zum Hauptmenü</button>
        </div>

        <!-- TEST SCREEN -->
        <div id="test-screen" class="screen hidden">
            <!-- 1. Zwischenseite vor dem Start -->
            <div id="test-start-box">
                <h2>Test-Modus</h2>
                <p>Bist du bereit? Sobald du auf "Test starten" klickst, läuft die Zeit!</p>
                <button id="start-test-btn" class="primary-btn">Test starten</button>
                <button class="back-to-menu-btn secondary-btn">Zurück zum Hauptmenü</button>
            </div>

            <!-- 2. Eigentlicher Test (anfangs versteckt) -->
            <div id="test-quiz-box" class="hidden">
                <div class="stats-bar">
                    <span>Frage: <strong id="test-question-num">1</strong>/10</span>
                    <span>Zeit: <strong id="test-timer">0.0</strong>s</span>
                    <span>Fehler: <strong id="test-errors">0</strong></span>
                </div>
                <div id="test-question-container"></div>
            </div>
        </div>

        <!-- ERGEBNIS SCREEN -->
        <div id="result-screen" class="screen hidden">
            <h2>Test Beendet!</h2>
            <div class="result-box">
                <p>Benötigte Zeit: <span id="final-time">0</span> Sekunden</p>
                <p>Fehlerpunkte: <span id="final-errors">0</span></p>
                <p class="score-display">Dein Score: <strong id="final-score">0</strong></p>
            </div>

            <div id="save-score-box">
                <input type="text" id="player-name" placeholder="Dein Name" maxlength="15">
                <button id="save-score-btn" class="primary-btn">In Highscore eintragen</button>
            </div>

            <button class="back-to-menu-btn secondary-btn">Zurück zum Hauptmenü</button>
        </div>

        <!-- HIGHSCORE SCREEN -->
        <div id="highscore-screen" class="screen hidden">
            <h2>Highscore-Liste</h2>
            <table id="highscore-table">
                <thead>
                    <tr>
                        <th>Platz</th>
                        <th>Name</th>
                        <th>Score</th>
                        <th>Zeit</th>
                        <th id="admin-header" class="hidden">Aktion</th>
                    </tr>
                </thead>
                <tbody id="highscore-body">
                    <!-- Highscores werden hier dynamsich eingefügt -->
                </tbody>
            </table>

            <div class="highscore-actions">
                <button class="back-to-menu-btn secondary-btn">Zurück</button>
                <button id="admin-toggle-btn" class="admin-btn">Admin-Modus</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
